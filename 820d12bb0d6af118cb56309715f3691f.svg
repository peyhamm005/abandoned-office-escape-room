<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="468.15108" height="244.18962" viewBox="0,0,468.15108,244.18962"><g transform="translate(-8.45968,-5.51663)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" font-size="40" text-anchor="start" style="mix-blend-mode: normal"><text transform="translate(8.75,35.75) scale(0.58063,0.69502)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">You look around the room for a password.</tspan></text><text transform="translate(70.50012,128.08125) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">You look around the room for a </tspan><tspan x="0" dy="46.150000000000006px">password but find nothing. The </tspan><tspan x="0" dy="46.150000000000006px">best thing you find is a note saying </tspan><tspan x="0" dy="46.150000000000006px">“FunIsLife90”. You enter that into </tspan><tspan x="0" dy="46.150000000000006px">the password, but it only accepts </tspan><tspan x="0" dy="46.150000000000006px">numbers.</tspan></text></g></g></svg>