<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="429.51201" height="259.7649" viewBox="0,0,429.51201,259.7649"><g transform="translate(-28.09982,-24.55384)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-weight="normal" font-size="40" text-anchor="start" style="mix-blend-mode: normal"><text transform="translate(28.5015,59.5) scale(0.80336,0.80336)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">You look around the room.</tspan></text><text transform="translate(49.62018,93.46875) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">You find many interesting things. </tspan><tspan x="0" dy="46.150000000000006px">There doesn’t seem to be any way </tspan><tspan x="0" dy="46.150000000000006px">out, however you find some interesting </tspan><tspan x="0" dy="46.150000000000006px">clues. On the wall you can faintly </tspan><tspan x="0" dy="46.150000000000006px">read a sign that says “TEST CHAMBER </tspan><tspan x="0" dy="46.150000000000006px">#01”. You realize you are in a test </tspan><tspan x="0" dy="46.150000000000006px">chamber. You also find a drawer </tspan><tspan x="0" dy="46.150000000000006px">with a keyboard and a sledgehammer </tspan><tspan x="0" dy="46.150000000000006px">inside. What do you do next?</tspan></text><text transform="translate(395.5487,151.35624) rotate(20.29743) scale(0.15206,0.15206)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Pixel" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">TEST CHAMBER #01</tspan></text></g></g></svg>